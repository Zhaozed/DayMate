name: Deploy Daymate Server to Alibaba Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Build Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

      - name: Build Server Bundle
        run: pnpm server:build

      - name: Prepare Deployment Artifacts
        run: |
          mkdir -p dist-deploy
          cp out/server/index.js dist-deploy/server.js
          cp deploy/package.json dist-deploy/package.json

      - name: Copy Server Artifacts via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist-deploy/*"
          target: "/opt/daymate"
          strip_components: 1

      - name: Install Server Native Dependencies & Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /opt/daymate/data
            cd /opt/daymate
            npm install --omit=dev
            # Restart or start daymate daemon via PM2
            pm2 restart daymate || pm2 start server.js --name daymate --time
            pm2 save
